name: Warm Cache

on:
  # Daily at 6 AM UTC (midnight CST)
  schedule:
    - cron: '0 6 * * *'

  # Also run after Vercel deploys (via webhook)
  repository_dispatch:
    types: [vercel-deploy]

  workflow_dispatch:

# Needed by the keepalive step, which commits a heartbeat so GitHub does not
# disable this schedule for inactivity.
permissions:
  contents: write

concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.SITE_URL || 'https://cristina8455.vercel.app' }}

    steps:
      - uses: actions/checkout@v4

      # The SITE_URL repo variable may carry a trailing slash, which would
      # produce "//sitemap.xml" and silently return nothing.
      - name: Normalize base URL
        run: echo "BASE_URL=${BASE_URL%/}" >> "$GITHUB_ENV"

      # Runs first so a broken data source is reported even if warming
      # succeeds — ISR will happily serve stale pages with Canvas down.
      # The result is gated at the end so warming still happens on a warning.
      - name: Check Canvas health
        id: health
        run: |
          echo "Checking $BASE_URL/api/health"
          response=$(curl -sSL --max-time 45 -w '\n%{http_code}' "$BASE_URL/api/health" || echo $'\n000')
          code=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "HTTP $code"
          printf '%s\n' "$body" | jq . 2>/dev/null || printf '%s\n' "$body"

          status=$(printf '%s' "$body" | jq -r '.status // "unreachable"' 2>/dev/null || echo unreachable)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

          if [ "$status" != "healthy" ]; then
            printf '%s' "$body" \
              | jq -r '.checks[]? | select(.ok == false) | "  - \(.name): \(.detail)"' 2>/dev/null \
              || true
          fi

      - name: Warm every URL in the sitemap
        id: warm
        run: |
          echo "Fetching $BASE_URL/sitemap.xml"
          urls=$(curl -sSL --max-time 60 "$BASE_URL/sitemap.xml" \
                 | grep -oE '<loc>[^<]+</loc>' \
                 | sed -E 's#</?loc>##g')

          count=$(printf '%s\n' "$urls" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::Sitemap returned no URLs — cannot warm cache"
            exit 1
          fi
          echo "Warming $count URLs"

          # Only failures are printed. Previously every URL was echoed, so a
          # broken page was one line among 700 and nothing failed the job —
          # which is how a batch of course pages served 500s unnoticed.
          server_errors=0
          client_errors=0
          server_list=""
          client_list=""

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -sL -o /dev/null --max-time 60 -w '%{http_code}' "$url" || echo 000)

            # One retry before believing it: a cold start or a blip should not
            # turn the whole run red.
            case "$code" in
              2*|3*) continue ;;
            esac
            sleep 2
            code=$(curl -sL -o /dev/null --max-time 60 -w '%{http_code}' "$url" || echo 000)

            case "$code" in
              2*|3*) ;;
              5*|000)
                server_errors=$((server_errors + 1))
                server_list="${server_list}  ${code}  ${url}"$'\n'
                ;;
              *)
                client_errors=$((client_errors + 1))
                client_list="${client_list}  ${code}  ${url}"$'\n'
                ;;
            esac
          done <<< "$urls"

          echo "Checked $count URLs: $server_errors server error(s), $client_errors client error(s)."
          echo "server_errors=$server_errors" >> "$GITHUB_OUTPUT"

          if [ -n "$client_list" ]; then
            echo "Client errors (usually a sitemap entry for a page that no longer exists):"
            printf '%s' "$client_list"
            echo "::warning::$client_errors URL(s) returned 4xx"
          fi

          if [ -n "$server_list" ]; then
            echo "Server errors:"
            printf '%s' "$server_list"
          fi

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which is how this job silently stopped running in April.
      # A heartbeat every ~45 days keeps the schedule alive without adding
      # daily commit noise.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $age_days day(s) ago."

          if [ "$age_days" -lt 45 ]; then
            echo "Recent enough; no heartbeat needed."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-warm.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-warm.txt
          git commit -m "chore: keepalive heartbeat so the warm-cache schedule stays enabled"
          git push

      # Both conditions are reported together, and after the keepalive, so one
      # problem never hides the other or skips the heartbeat.
      - name: Report
        if: always()
        run: |
          status='${{ steps.health.outputs.status }}'
          broken='${{ steps.warm.outputs.server_errors }}'
          failed=0

          if [ "$status" != "healthy" ]; then
            echo "::error::Canvas health check reported '$status' (HTTP ${{ steps.health.outputs.code }}). The site may be serving stale content."
            failed=1
          fi

          if [ -n "$broken" ] && [ "$broken" -gt 0 ]; then
            echo "::error::$broken page(s) returned 5xx. The site is serving broken pages — see the warming step for the list."
            failed=1
          fi

          [ "$failed" -eq 0 ] && echo "Canvas healthy, no broken pages."
          exit "$failed"
