name: Warm Cache

on:
  # Daily at 6 AM UTC (midnight CST)
  schedule:
    - cron: '0 6 * * *'

  # Also run after Vercel deploys (via webhook)
  repository_dispatch:
    types: [vercel-deploy]

  workflow_dispatch:

# Needed by the keepalive step, which commits a heartbeat so GitHub does not
# disable this schedule for inactivity.
permissions:
  contents: write

concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.SITE_URL || 'https://cristina8455.vercel.app' }}

    steps:
      - uses: actions/checkout@v4

      # The SITE_URL repo variable may carry a trailing slash, which would
      # produce "//sitemap.xml" and silently return nothing.
      - name: Normalize base URL
        run: echo "BASE_URL=${BASE_URL%/}" >> "$GITHUB_ENV"

      # Runs first so a broken data source is reported even if warming
      # succeeds — ISR will happily serve stale pages with Canvas down.
      # The result is gated at the end so warming still happens on a warning.
      - name: Check Canvas health
        id: health
        run: |
          echo "Checking $BASE_URL/api/health"
          response=$(curl -sSL --max-time 45 -w '\n%{http_code}' "$BASE_URL/api/health" || echo $'\n000')
          code=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "HTTP $code"
          printf '%s\n' "$body" | jq . 2>/dev/null || printf '%s\n' "$body"

          status=$(printf '%s' "$body" | jq -r '.status // "unreachable"' 2>/dev/null || echo unreachable)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

          if [ "$status" != "healthy" ]; then
            printf '%s' "$body" \
              | jq -r '.checks[]? | select(.ok == false) | "  - \(.name): \(.detail)"' 2>/dev/null \
              || true
          fi

      - name: Warm every URL in the sitemap
        run: |
          echo "Fetching $BASE_URL/sitemap.xml"
          urls=$(curl -sSL --max-time 60 "$BASE_URL/sitemap.xml" \
                 | grep -oE '<loc>[^<]+</loc>' \
                 | sed -E 's#</?loc>##g')

          count=$(printf '%s\n' "$urls" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::Sitemap returned no URLs — cannot warm cache"
            exit 1
          fi
          echo "Warming $count URLs"

          failed=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -sL -o /dev/null --max-time 60 -w '%{http_code}' "$url")
            printf '  %-6s %s\n' "$code" "$url"
            case "$code" in
              2*|3*) ;;
              *) failed=$((failed + 1)) ;;
            esac
          done <<< "$urls"

          echo "Done. $failed of $count returned an error status."
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed URL(s) did not return success"
          fi

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which is how this job silently stopped running in April.
      # A heartbeat every ~45 days keeps the schedule alive without adding
      # daily commit noise.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $age_days day(s) ago."

          if [ "$age_days" -lt 45 ]; then
            echo "Recent enough; no heartbeat needed."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-warm.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-warm.txt
          git commit -m "chore: keepalive heartbeat so the warm-cache schedule stays enabled"
          git push

      - name: Fail if Canvas is unhealthy
        if: steps.health.outputs.status != 'healthy'
        run: |
          echo "::error::Canvas health check reported '${{ steps.health.outputs.status }}' (HTTP ${{ steps.health.outputs.code }}). The site may be serving stale content."
          exit 1
